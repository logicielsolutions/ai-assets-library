[project]
name = "agent-memory"
version = "0.3.0"
description = "Long-term memory for agents on Zep Cloud: write rules, dated facts, sources and forgetting"
requires-python = ">=3.10"
dependencies = ["zep-cloud>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_memory"]
