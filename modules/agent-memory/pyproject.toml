[project]
name = "agent-memory"
version = "0.5.0"
description = "Drop-in long-term memory for any assistant, on Zep Cloud: write rules, dated facts, sources, forgetting, expiry"
requires-python = ">=3.10"
dependencies = ["zep-cloud>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_memory"]
